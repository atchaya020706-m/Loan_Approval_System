<!DOCTYPE html>
<html>

<head>

    <title>EMI Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


    <h1>💰 EMI Calculator</h1>


    <p>
        Calculate your monthly loan EMI
    </p>



    <form action="/emi" method="POST">


        <label>
            Loan Amount
        </label>

        <input type="number"
               name="amount"
               placeholder="Enter Loan Amount"
               required>



        <label>
            Interest Rate (%)
        </label>

        <input type="number"
               step="0.01"
               name="rate"
               placeholder="Enter Interest Rate"
               required>




        <label>
            Loan Tenure (Years)
        </label>

        <input type="number"
               name="years"
               placeholder="Enter Years"
               required>



        <button type="submit">
            Calculate EMI
        </button>


    </form>




    {% if emi %}


    <div class="result">


        <h2>
            Monthly EMI : ₹{{emi}}
        </h2>


        <h3>
            Total Interest : ₹{{interest}}
        </h3>


        <h3>
            Total Payment : ₹{{total}}
        </h3>


    </div>


    {% endif %}




    <br>


    <a href="/dashboard" class="btn">
        Back to Dashboard
    </a>


</div>


</body>

</html>
